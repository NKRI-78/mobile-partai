name: partai
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  # C 
  camera: ^0.10.0+1
  cupertino_icons: ^1.0.8
  cunning_document_scanner: ^1.2.3

  # D
  dio: ^5.8.0+1
  
  # F
  flutter_spinkit: ^5.2.1
  flutter_staggered_grid_view: ^0.7.0

  # G
  google_mlkit_face_detection: ^0.13.1
  get_it: ^7.6.7

  # P
  provider: ^6.1.4

  # T
  tflite_flutter: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/
    - assets/fonts/
    - assets/images/
    - assets/images/icons/
    - assets/images/logo/
  
  fonts:
    - family: ArOneSans
      fonts:
        - asset: assets/fonts/ar_one_sans/AROneSans-Bold.ttf
        - asset: assets/fonts/ar_one_sans/AROneSans-Medium.ttf
        - asset: assets/fonts/ar_one_sans/AROneSans-Regular.ttf
        - asset: assets/fonts/ar_one_sans/AROneSans-SemiBold.ttf
    - family: Montserrat
      fonts: 
        - asset: assets/fonts/montserrat/Montserrat-Bold.ttf
        - asset: assets/fonts/montserrat/Montserrat-Medium.ttf
        - asset: assets/fonts/montserrat/Montserrat-Regular.ttf
        - asset: assets/fonts/montserrat/Montserrat-SemiBold.ttf
    